name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede stale runs: a newer push to the same PR or renovate branch cancels
# the older run; other refs keep at most one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: npm ci
      - name: Install Tessl CLI (for tile-lint integration test)
        uses: tesslio/setup-tessl@v2
      - name: Run tests
        run: npm test
      - name: "Smoke: build the example"
        run: node bin/x927.js build --dry-run examples/app-builder/PLUGIN.md
