name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Compile example PLUGIN.md
        run: node bin/x927.js build --dry-run examples/app-builder/PLUGIN.md
      - name: Run tests
        run: npm test --if-present
