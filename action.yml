name: x927 (AI Ecoverse)
description: Compile an Agent Plugins plugin.json into Claude Code, Tessl, Cursor and Codex manifests, and check that they are in sync.
author: ai-ecoverse

branding:
  icon: git-branch
  color: purple

inputs:
  command:
    description: 'x927 subcommand: build | diff'
    default: build
  path:
    description: The plugin's directory, or with all the repository's.
    default: .
  all:
    description: Compile every plugin under path, and keep the marketplace catalogs in line.
    default: 'false'
  target:
    description: Comma-separated targets (claude,tessl,cursor,codex). Empty = the targets each plugin declares.
    required: false
  version:
    description: x927 version to run via npx (e.g. "2.0.0" or "latest").
    default: latest

runs:
  using: composite
  steps:
    - name: Run x927
      shell: bash
      env:
        X927_TARGET: ${{ inputs.target }}
        X927_VERSION: ${{ inputs.version }}
        X927_COMMAND: ${{ inputs.command }}
        X927_PATH: ${{ inputs.path }}
        X927_ALL: ${{ inputs.all }}
      run: |
        ARGS=("$X927_COMMAND" "$X927_PATH")
        if [ "$X927_ALL" = "true" ]; then ARGS+=(--all); fi
        if [ -n "$X927_TARGET" ]; then ARGS+=(--target "$X927_TARGET"); fi
        npx -y "x927@$X927_VERSION" "${ARGS[@]}"
